<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GM Display — Player</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/gm-display.css">
</head>
<body>
<div id="remote-view" >
  <div id="remote-select">
    <div class="remote-select-box">
      <h2>Join the table</h2>
      <input type="text" id="remote-name" placeholder="Your name" autocomplete="off">
      <div class="remote-color-row">
        <span>Your color</span>
        <div id="remote-color-swatches"></div>
      </div>
      <div class="remote-pick-label">Pick your character</div>
      <div id="remote-roster"><div class="remote-empty">Waiting for the GM…</div></div>

      <!-- ...or bring your own. Nothing here is real until the GM lets you in:
           the character, and the portrait especially, sit in the GM's queue
           and reach no screen at the table until they say so. -->
      <div id="remote-new">
        <div class="remote-pick-label">…or add your own</div>
        <input type="text" id="remote-character" placeholder="Character name" autocomplete="off">
        <div class="remote-new-row">
          <button id="remote-portrait-btn" type="button">Add a portrait</button>
          <span id="remote-portrait-name"></span>
          <input type="file" id="remote-portrait" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
        </div>
        <button id="remote-join-btn" class="primary">Ask to join</button>
        <div id="remote-join-status"></div>
      </div>
      <!-- The GM, on a device other than their own Mac: type the code from the
           GM page's Displays panel to get GM powers here. -->
      <div id="remote-gm-row">
        <button id="remote-gm-login" type="button">GM login</button>
        <span id="remote-gm-status"></span>
      </div>
    </div>
  </div>
  <div id="remote-stage" class="map-only">
    <canvas id="remote-canvas"></canvas>
    <canvas id="remote-grid-canvas"></canvas>
    <canvas id="remote-marker-canvas"></canvas>
    <div id="remote-token-layer"></div>
    <canvas id="remote-note-canvas"></canvas>
  </div>
  <!-- Hover peek at what the party wrote on a hex. Party notes only — the
       GM's prep never reaches this page. -->
  <div id="remote-note-tip" class="map-only"></div>
  <div id="remote-note-panel" class="map-only"></div>
  <div id="remote-log-panel" class="map-only"></div>
  <div id="remote-legend-panel" class="map-only"></div>
  <!-- The campaign's bulletin board: every handout the GM has shared, from
       every module. Shared by the whole table — one person pans, everyone pans. -->
  <div id="remote-board"></div>
  <div id="remote-bar" >
    <span class="remote-tools">
      <button id="remote-tool-map" class="on" title="The map on the table">🗺 Map</button>
      <button id="remote-tool-board" title="The campaign's bulletin board — every handout so far">📌 Board<span class="rt-badge"></span></button>
    </span>
    <span id="remote-color-dot"></span>
    <span id="remote-who"></span>
    <span id="remote-token-info" class="map-only"></span>
    <span class="board-spacer" style="flex:1;"></span>
    <button id="remote-change-btn">Change</button>
    <button id="remote-marker-btn" class="map-only">Marker</button>
    <button id="remote-notes-btn" class="map-only">Notes</button>
    <button id="remote-log-btn" class="map-only">Log</button>
    <button id="remote-legend-btn" class="map-only">Legend</button>
  </div>
</div>
<script type="module" src="js/remote.js"></script>
</body>
</html>
