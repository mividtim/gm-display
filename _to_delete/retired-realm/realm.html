<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Realm — Mythic Bastionland Campaign 1</title>
<style>
  :root{
    --ink:#2b2118; --parch:#f4ead6; --parch2:#e9dcc0; --edge:#c8b58c;
    --accent:#7a1f1f; --accent2:#2f5d50; --muted:#6d6152;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--ink); color:var(--ink);
    font:15px/1.5 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    display:flex; overflow:hidden;
  }
  /* ---------- map pane ---------- */
  #stage{position:relative;flex:1;overflow:hidden;background:#191410;cursor:grab}
  #stage.drag{cursor:grabbing}
  #world{position:absolute;transform-origin:0 0;will-change:transform}
  #world img{display:block;user-select:none;-webkit-user-drag:none}
  #grid{position:absolute;inset:0}
  #grid polygon{fill:transparent;stroke:transparent;stroke-width:3;cursor:pointer}
  #grid polygon:hover{fill:rgba(255,240,190,.22);stroke:rgba(255,236,170,.9)}
  #grid polygon.sel{fill:rgba(255,214,120,.28);stroke:#ffcf5c;stroke-width:6}
  #grid polygon.flag{fill:rgba(122,31,31,.18);stroke:rgba(122,31,31,.55)}
  #grid polygon.hidden-hex{fill:rgba(10,8,6,.86);stroke:rgba(0,0,0,.5)}
  #grid text{font:600 15px system-ui;fill:rgba(30,20,10,.55);pointer-events:none;text-anchor:middle}
  /* ---------- toolbar ---------- */
  #bar{
    position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;
    align-items:center;flex-wrap:wrap;pointer-events:none;z-index:5;
  }
  #bar > *{pointer-events:auto}
  .btn{
    background:var(--parch);border:1px solid var(--edge);border-radius:6px;
    padding:6px 11px;font:600 13px/1 system-ui;color:var(--ink);cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.35)
  }
  .btn:hover{background:#fff8e8}
  .btn.on{background:var(--accent);color:#fff2dd;border-color:#5a1414}
  .pill{
    background:rgba(28,22,16,.78);color:var(--parch);border:1px solid #4a3d2c;
    border-radius:6px;padding:6px 10px;font:600 13px/1 system-ui
  }
  /* ---------- side panel ---------- */
  #side{
    width:392px;min-width:392px;height:100%;overflow-y:auto;
    background:linear-gradient(180deg,var(--parch),var(--parch2));
    border-left:3px solid #1d160f;padding:18px 20px 60px
  }
  #side h1{font-size:20px;margin:0 0 2px;letter-spacing:.02em}
  #side .sub{color:var(--muted);font-size:12.5px;margin-bottom:14px;font-family:system-ui}
  .card{
    background:rgba(255,255,255,.45);border:1px solid var(--edge);
    border-radius:8px;padding:12px 14px;margin-bottom:12px
  }
  .card h2{font-size:15px;margin:0 0 8px;letter-spacing:.04em;text-transform:uppercase;
           font-family:system-ui;color:var(--accent)}
  .coord{font:700 26px/1 system-ui;letter-spacing:.02em}
  .terr{font-size:15px;color:var(--muted);font-family:system-ui;margin-top:2px}
  .tag{
    display:inline-block;background:var(--accent);color:#fff3e0;border-radius:99px;
    padding:2px 10px;font:600 11.5px/1.6 system-ui;margin:0 5px 5px 0;letter-spacing:.03em
  }
  .tag.g{background:var(--accent2)} .tag.b{background:#4a4130}
  .note{white-space:pre-wrap;font-size:14px;margin:8px 0 0}
  .row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;
       border-bottom:1px dotted var(--edge);font-family:system-ui;font-size:13.5px}
  .row:last-child{border-bottom:0}
  .row a{color:var(--accent);text-decoration:none;font-weight:600;cursor:pointer}
  .row a:hover{text-decoration:underline}
  .rule{font-size:13px;font-family:system-ui;color:#4a4034}
  .rule b{color:var(--ink)}
  .k{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:6px;
     vertical-align:-2px;border:1px solid rgba(0,0,0,.25)}
  .sw{width:30px;height:30px;vertical-align:-9px;margin-right:8px}
  .swbig{width:40px;height:40px;vertical-align:-13px;margin-right:10px}
  .keyrow{display:flex;align-items:center;gap:10px;padding:4px 0;font-family:system-ui;font-size:13.5px}
  .keyrow b{font-weight:600}
  .keyrow small{color:var(--muted);display:block;font-size:12px}
  .empty{color:var(--muted);font-style:italic;font-size:13.5px}
  #side::-webkit-scrollbar{width:10px}
  #side::-webkit-scrollbar-thumb{background:#c3b08a;border-radius:5px}
  @media (max-width:900px){ body{flex-direction:column} #side{width:100%;min-width:0;height:46%} }
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <img id="mapimg" alt="Realm map">
    <svg id="grid" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  <div id="bar">
    <button class="btn on" id="tGM">GM view</button>
    <button class="btn" id="tCoord">Coords</button>
    <button class="btn" id="tMark">Landmark hexes</button>
    <button class="btn" id="tFog">Fog</button>
    <button class="btn" id="fit">Fit</button>
    <button class="btn" id="send">Send to projector</button>
    <span class="pill" id="hint">click a hex</span>
  </div>
</div>

<div id="side">
  <h1>The Realm</h1>
  <div class="sub">Mythic Bastionland · Campaign 1 · 12 × 12 hexes · coordinates are row,column</div>
  <div id="detail"></div>
  <div id="indexes"></div>
</div>

const byKey = {};
D.hexes.forEach(h => byKey[h.row + ',' + h.col] = h);

/* ---------------- build the SVG hex grid ---------------- */
const svg = document.getElementById('grid');
const NS = 'http://www.w3.org/2000/svg';
svg.setAttribute('viewBox', `0 0 ${D.cw} ${D.ch}`);
svg.setAttribute('width', D.cw); svg.setAttribute('height', D.ch);

function poly(cx, cy, R){
  const p = [], off = D.flatTop ? 0 : -90;         // flat-top matches the realm sheet
  for (let i = 0; i < 6; i++){
    const a = Math.PI/180 * (60*i + off);
    p.push((cx + R*Math.cos(a)).toFixed(1) + ',' + (cy + R*Math.sin(a)).toFixed(1));
  }
  return p.join(' ');
}
const labels = document.createElementNS(NS, 'g');
D.hexes.forEach(h => {
  const el = document.createElementNS(NS, 'polygon');
  el.setAttribute('points', poly(h.cx, h.cy, D.R - 1));
  el.dataset.k = h.row + ',' + h.col;
  el.addEventListener('click', e => { e.stopPropagation(); if (moved > 5) return; select(h.row, h.col); });
  svg.appendChild(el);
  const t = document.createElementNS(NS, 'text');
  t.setAttribute('x', h.cx); t.setAttribute('y', h.cy - (D.flatTop ? D.R*0.866 : D.R) + 22);
  t.textContent = h.row + ',' + h.col;
  labels.appendChild(t);
});
svg.appendChild(labels);
labels.style.display = 'none';

/* ---------------- pan & zoom ---------------- */
const stage = document.getElementById('stage'), world = document.getElementById('world');
const img = document.getElementById('mapimg');
let sc = 1, tx = 0, ty = 0;
function apply(){ world.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`; }
function fit(){
  const r = stage.getBoundingClientRect();
  sc = Math.min(r.width / D.cw, r.height / D.ch) * 0.97;
  tx = (r.width - D.cw*sc)/2; ty = (r.height - D.ch*sc)/2; apply();
}
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const f = Math.exp(-e.deltaY * 0.0016), ns = Math.min(6, Math.max(0.15, sc*f));
  tx = mx - (mx - tx) * (ns/sc); ty = my - (my - ty) * (ns/sc); sc = ns; apply();
}, {passive:false});
/* Capture the pointer only once a drag really starts. Capturing on pointerdown
   retargets every subsequent click to #stage, which silently kills the toolbar
   buttons and the hex hit areas. */
let down = false, dragging = false, moved = 0, pid = null;
stage.addEventListener('pointerdown', e => {
  if (e.target.closest && e.target.closest('#bar')) return;   // let the buttons work
  down = true; dragging = false; moved = 0; pid = e.pointerId;
});
stage.addEventListener('pointermove', e => {
  if (!down) return;
  moved += Math.abs(e.movementX) + Math.abs(e.movementY);
  if (!dragging && moved > 5){
    dragging = true; stage.classList.add('drag');
    try { stage.setPointerCapture(pid); } catch (_) {}
  }
  if (dragging){ tx += e.movementX; ty += e.movementY; apply(); }
});
function endDrag(){
  if (dragging){ try { stage.releasePointerCapture(pid); } catch (_) {} }
  down = false; dragging = false; stage.classList.remove('drag');
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);

/* ---------------- state ---------------- */
let gm = true, showCoord = false, showMark = false, fog = false, sel = null;
const revealed = new Set();

function setImg(){ img.src = gm ? GM_IMG : PLAYER_IMG; }
setImg();
img.addEventListener('load', () => { if (!sel) fit(); });
img.addEventListener('error', () => {
  document.getElementById('hint').textContent = 'map image missing: ' + img.getAttribute('src');
  img.style.width = D.cw + 'px'; img.style.height = D.ch + 'px';   // keep the grid clickable
  img.style.background = '#f4ead6';
});

function refresh(){
  labels.style.display = showCoord ? '' : 'none';
  svg.querySelectorAll('polygon').forEach(el => {
    const h = byKey[el.dataset.k];
    el.classList.toggle('sel',  sel && sel === el.dataset.k);
    el.classList.toggle('flag', showMark && gm && !!(h.landmarks || h.myth));
    el.classList.toggle('hidden-hex', fog && !revealed.has(el.dataset.k));
  });
}

/* ---------------- detail panel ---------------- */
function esc(s){ return String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }

function select(row, col){
  sel = row + ',' + col;
  if (fog) revealed.add(sel);
  const h = byKey[sel];
  const t = [];
  t.push(`<div class="card"><div class="coord">Hex ${h.row},${h.col}</div>
          <div class="terr"><img class="swbig" src="${D.swatch[h.key]}">${h.terrain}${h.river ? ' · navigable river' : ''}</div>`);
  if (h.holding) t.push(`<div style="margin-top:9px"><span class="tag g">${esc(h.holding.type)}</span>
     <b>${esc(h.holding.name)}</b><div class="note">${esc(h.holding.notes)}</div></div>`);
  if (gm && h.myth) t.push(`<div style="margin-top:9px"><span class="tag">Myth ${h.myth.n}</span>
     <b>${esc(h.myth.name)}</b> — p${h.myth.page}
     <div class="note">Omens encountered so far: ${h.myth.omens}. Ending a Phase here reveals the next Omen without a Wilderness Roll.</div></div>`);
  if (gm && h.landmarks) h.landmarks.forEach(k =>
     t.push(`<div style="margin-top:9px"><span class="tag b">${k}</span><div class="note">${esc(D.landmarkText[k])}</div></div>`));
  if (gm && h.barriers) t.push(`<div style="margin-top:9px"><span class="tag">Barrier</span>
     <div class="note">Cannot travel to ${h.barriers.map(b => b[0]+','+b[1]).join(' · ')} by normal means.</div></div>`);
  if (!gm && (h.myth || h.landmarks)) t.push(`<div class="empty" style="margin-top:8px">Hidden in player view.</div>`);
  t.push('</div>');
  document.getElementById('detail').innerHTML = t.join('');
  document.getElementById('hint').textContent = `hex ${h.row},${h.col} — ${h.terrain}`;
  refresh();
}

function indexes(){
  const L = [];
  L.push('<div class="card"><h2>Myths</h2>' + D.myths.map(m =>
    `<div class="row"><span>${m.n}. ${esc(m.name)} <span style="color:var(--muted)">p${m.page} · ${m.omens} omen${m.omens===1?'':'s'}</span></span>
     <a data-go="${m.row},${m.col}">${m.row},${m.col}</a></div>`).join('') + '</div>');
  L.push('<div class="card"><h2>Holdings</h2>' + D.holdings.map(h =>
    `<div class="row"><span>${esc(h.type)} — ${esc(h.name)}</span><a data-go="${h.row},${h.col}">${h.row},${h.col}</a></div>`).join('') + '</div>');
  const kinds = {};
  D.hexes.forEach(h => (h.landmarks||[]).forEach(k => (kinds[k] = kinds[k]||[]).push(h)));
  L.push('<div class="card"><h2>Landmarks</h2>' + Object.keys(kinds).map(k =>
    `<div class="row"><span>${k}</span><span>${kinds[k].map(h=>`<a data-go="${h.row},${h.col}">${h.row},${h.col}</a>`).join(' · ')}</span></div>`).join('') + '</div>');
  const tc = {};
  D.hexes.forEach(h => tc[h.key] = (tc[h.key]||0) + 1);
  const TORDER = [['MARSH',1,'wet reedbeds, slow going'],['HEATH',2,'open scrub and heather'],
    ['CRAG',3,'broken rock and scree'],['PEAKS',4,'high mountains'],['FOREST',5,'dense old woodland'],
    ['VALLEY',6,'river valley, the water runs through'],['HILLS',7,'rolling high ground'],
    ['MEADOW',8,'lush open grassland'],['BOG',9,'dark peat and standing pools'],
    ['LAKE',10,'deep open water'],['GLADE',11,'light, scattered woodland'],['PLAINS',12,'flat, empty country']];
  L.push('<div class="card"><h2>Terrain key</h2>' + TORDER.map(([k,num,gloss]) =>
    `<div class="keyrow"><img class="sw" src="${D.swatch[k]}">
       <span style="color:var(--muted);width:16px;text-align:right">${num}</span>
       <span><b>${k[0]+k.slice(1).toLowerCase()}</b><small>${gloss}</small></span>
       <span style="margin-left:auto;color:var(--muted)">${tc[k]||0}</span></div>`).join('') + '</div>');
  const MARKS = [['Castle','Castle','the Seat of Power'],['Fortress','Fortress',''],['Town','Town',''],
    ['Tower','Tower',''],['River','Navigable river','cruise 3 hexes by boat']];
  const GMARKS = [['Myth','Myth hex','reveals an Omen with no Wilderness Roll'],
    ['Dwelling','Dwellings','humble homes amid the wilds'],['Sanctum','Sanctum','a Seer lives here'],
    ['Monument','Monument','restores SPI as a Sacrament'],['Hazard','Hazard','push through and lose d6 VIG'],
    ['Curse','Curse','next Phase counts as travelling blind'],['Ruin','Ruins','hint at a dormant Myth'],
    ['Barrier','Barrier','impassable by normal means']];
  const marks = gm ? MARKS.concat(GMARKS) : MARKS;
  L.push('<div class="card"><h2>Map key</h2>' + marks.map(([k,name,gloss]) =>
    `<div class="keyrow"><img class="sw" src="${D.iconsw[k]}">
       <span><b>${name}</b>${gloss ? `<small>${gloss}</small>` : ''}</span></div>`).join('') + '</div>');
  L.push('<div class="card"><h2>At the table</h2>' + RULES.map(([h,b]) =>
    `<div style="margin-bottom:9px"><div style="font:600 13px system-ui;color:var(--accent)">${h}</div><div class="rule">${b}</div></div>`).join('') + '</div>');
  const el = document.getElementById('indexes');
  el.innerHTML = L.join('');
  el.querySelectorAll('[data-go]').forEach(a => a.addEventListener('click', () => {
    const [row, col] = a.dataset.go.split(',').map(Number);
    select(row, col); centre(row, col);
  }));
}

function centre(row, col){
  const h = byKey[row + ',' + col], b = stage.getBoundingClientRect();
  sc = Math.max(sc, 1.1);
  tx = b.width/2 - h.cx*sc; ty = b.height/2 - h.cy*sc; apply();
}

/* ---------------- toolbar ---------------- */
function tog(id, get, set){
  const b = document.getElementById(id);
  b.addEventListener('click', () => { set(!get()); b.classList.toggle('on', get()); refresh(); });
}
document.getElementById('tGM').addEventListener('click', function(){
  gm = !gm; this.classList.toggle('on', gm); this.textContent = gm ? 'GM view' : 'Player view';
  setImg(); if (sel) select(...sel.split(',').map(Number)); indexes(); refresh();
});
tog('tCoord', () => showCoord, v => showCoord = v);
tog('tMark',  () => showMark,  v => showMark = v);
tog('tFog',   () => fog,       v => fog = v);
document.getElementById('fit').addEventListener('click', fit);
document.getElementById('send').addEventListener('click', async () => {
  const file = gm ? GM_IMG : PLAYER_IMG;
  const hint = document.getElementById('hint');
  try{
    await fetch('/api/command', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:'map', file: file.replace(/^uploads\//,'')})});
    hint.textContent = 'sent to projector';
  }catch(e){ hint.textContent = 'server not reachable'; }
});
addEventListener('keydown', e => {
  if (e.key === 'g') document.getElementById('tGM').click();
  if (e.key === 'c') document.getElementById('tCoord').click();
  if (e.key === 'f') fit();
});
addEventListener('resize', () => { if (!sel) fit(); });

indexes(); refresh(); fit();
document.getElementById('detail').innerHTML =
  '<div class="card"><div class="coord">The Realm</div><div class="terr">Click any hex for its terrain, holding, myth, landmarks and barriers.</div></div>';
</script>
</body>
</html>
