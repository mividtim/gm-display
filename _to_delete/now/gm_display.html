<!DOCTYPE html>
<meta charset="utf-8">
<title>GM Display</title>
<!-- The single-page app was split into gm.html / display.html / remote.html.
     This shim keeps old bookmarks, the menu-bar app and any saved projector
     window URLs working. -->
<script>
  const p = new URLSearchParams(location.search);
  const mode = p.get('mode');
  location.replace(mode === 'remote' ? 'remote.html'
                 : mode === 'player' ? 'display.html?display=' + (p.get('display') || 'map')
                 : 'gm.html');
</script>
