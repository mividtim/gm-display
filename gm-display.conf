# GM Display — settings for the menu-bar app (⚔️)
#
# Read every time the app starts or restarts the server, so edit, then
# "Restart Server" from the menu. Lines starting with # are ignored.

# --- arguments for server.py, one per line --------------------------------
# Listen on the LAN, not just loopback: the box running the ngrok tunnel is a
# different machine, and without this it cannot reach the server at all.
# Remove it and only this Mac can.
--lan

# --- which browser, and which PROFILE, pages open in -----------------------
# Not cosmetic. Every campaign, roster, fog mask and grid calibration lives in
# localStorage, which browsers keep per PROFILE. Open the GM page in the wrong
# profile and you get a different, empty world at the same URL.
#
# Use the profile's FOLDER name (visit dia://version or chrome://version and
# read the last part of "Profile Path": Default, Profile 1, ...).
# {url} is replaced with the page's address. Leave empty for the default browser.
browser: open -na Dia --args --profile-directory=Default {url}

# Open the GM page when the app starts the server at login.
open-gm-page-at-launch: yes

# Which python runs server.py. The app starts it as its own child, so macOS
# asks once whether "GM Display" may read your Documents folder.
python: /usr/bin/python3
